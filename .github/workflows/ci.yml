name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and type-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  docs:
    name: Docs build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict
      - name: The handoff material is not part of the site
        run: if (Test-Path site/handoff) { throw "docs/handoff was built into the site" }
      # the site is published from main only (job "pages")
      - uses: actions/configure-pages@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  pages:
    name: Publish the documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: windows-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  executable:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[gui,pdf,release]"
      # freezes the desktop application, runs its self-test and packs it (ADR-055)
      - run: python scripts/build_exe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: csr-gui-windows
          path: |
            dist/csr-gui-*-windows.zip
            dist/self-test.txt
          if-no-files-found: error
