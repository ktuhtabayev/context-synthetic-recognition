site_name: Context-synthetic recognition
site_description: Context-synthetic model of recognition algorithms (CS-model)
repo_url: https://github.com/ktuhtabayev/context-synthetic-recognition
repo_name: ktuhtabayev/context-synthetic-recognition
docs_dir: docs

# The handoff material is source material, not documentation pages
exclude_docs: |
  handoff/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Algorithm reference: algorithm-reference.md
  - Decisions: DECISIONS.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
