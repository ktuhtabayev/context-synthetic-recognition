[project]
name = "context-synthetic-recognition"
version = "0.2.0"
description = "Context-synthetic model of recognition algorithms (CS-model): library, CLI and desktop GUI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Kudratillo Tuhtabayev", email = "ktuhtabayev@gmail.com" }
]
keywords = [
  "pattern recognition",
  "algebraic approach",
  "Zhuravlyov metric",
  "k nearest neighbours",
  "synthetic features",
  "meta-algorithm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# Runtime dependencies are added with the milestone that first uses them (ADR-015).
dependencies = [
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "tomli-w>=1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
# Parquet datasets (ADR-018)
parquet = ["pyarrow>=15"]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "pyarrow>=15",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-openpyxl>=3.1",
  "types-PyYAML>=6.0",
]
docs = [
  # MkDocs 2.0 drops the plugin/theme system Material depends on (ADR-015)
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
]

[project.scripts]
csr = "context_synthetic_recognition.cli.app:main"

[project.urls]
Repository = "https://github.com/ktuhtabayev/context-synthetic-recognition"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_synthetic_recognition = ["py.typed", "data/datasets/*.csv"]

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "golden: acceptance tests against the Excel experiment workbook",
  "slow: long-running tests (large datasets, full cross-validation)",
  "gui: tests that need a Qt application",
]

[tool.coverage.run]
source = ["context_synthetic_recognition"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------- lint / format
[tool.ruff]
line-length = 100
target-version = "py311"
# Protected source material: never reformatted or linted (CLAUDE.md)
extend-exclude = ["resources", "docs/handoff"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # import order
  "B",            # bugbear
  "UP",           # pyupgrade
  "SIM",          # simplify
  "C4",           # comprehensions
  "PIE", "RET", "ISC",
  "PTH",          # pathlib
  "N",            # naming
  "D",            # docstrings (every public function names its article formula/step)
  "NPY",          # numpy
  "PT",           # pytest style
  "T20",          # no print() in the library
  "RUF",
]
ignore = [
  # The article's notation is kept in docstrings and messages (ρ, α, θ, ϰ, ×, −, …)
  "RUF001", "RUF002", "RUF003",
  # Mathematical names follow the article (X, K1, M1, …)
  "N803", "N806",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N802"]

# ---------------------------------------------------------------- types
[tool.mypy]
# numpy ≥ 2.5 ships stubs with PEP 695 `type` statements (Python 3.12 syntax); ruff's py311
# target and the Python 3.11 test jobs keep the code itself 3.11-compatible (ADR-015).
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
