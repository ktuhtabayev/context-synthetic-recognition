# Protected source material is never touched by hooks (CLAUDE.md)
exclude: ^(resources|docs/handoff)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--unsafe]  # syntax only: mkdocs.yml uses a !!python/name tag
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^src/
        args: []
        additional_dependencies:
          - numpy>=1.26
          - openpyxl>=3.1
          - types-openpyxl>=3.1
          - pydantic>=2.7
          - PyYAML>=6.0
          - types-PyYAML>=6.0
          - tomli-w>=1.0
          - typer>=0.12
